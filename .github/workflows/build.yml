name: build-dashboard
on:
  schedule:
    - cron: '*/30 5-18 * * *'   # minden 30 percben 08:00–21:00 RO (nyári idő, UTC+3)
  workflow_dispatch:            # kézi indítás is
permissions:
  contents: write        # a lezárt hónap archívumát visszaírja a repóba
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate encrypted dashboard
        run: node generate.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHBOARD_PIN: ${{ secrets.DASHBOARD_PIN }}
          DPD_USERNAME: ${{ secrets.DPD_USERNAME }}
          DPD_PASSWORD: ${{ secrets.DPD_PASSWORD }}

      - name: Commit month archive (ha lezárt hónap mentődött)
        run: |
          if [ -n "$(git status --porcelain archiv)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add archiv
            git commit -m "archiv: havi pillanatkep frissitve [skip ci]"
            git push
          else
            echo "archivum valtozatlan"
          fi
      - name: Assemble site
        run: mkdir -p _site && cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
